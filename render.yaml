# Blueprint de Render: crea el servicio web gratuito de MeatSys.
services:
  - type: web
    name: meatsys
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: MeatSys
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: MEATSYS_DEMO
        value: "true"
      - key: MEATSYS_NEGOCIO
        value: Carnicería MeatSys
      - key: MEATSYS_DIRECCION
        value: Montería, Córdoba
